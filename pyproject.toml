[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endfield"
version = "1.3.1"
description = "Low-latency secondary-PC YOLO inference with tunable motion control"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "av>=14,<16",
  "kmbox-universal>=0.1.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pywebview>=5.0,<6",
  "tomli-w>=1.2,<2",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
cpu = [
  "onnxruntime==1.26.0",
]
nvidia = [
  "onnx>=1.17,<2",
  "onnxruntime-gpu[cuda,cudnn]==1.26.0",
  "tensorrt-cu12==10.9.0.34",
]
# 兼容 v1.3.0 的安装命令；WebView 已是默认界面的标准依赖。
webview = []
# 单机模式的本机屏幕采集 (DXGI 桌面复制 / WGC)。只用副机的人不需要。
# 钉在 0.3.x: desktop_source.py 给这个版本打了一个双重释放的补丁, 换版本之前
# 要先确认上游修没修。不要加 cv2 这个 extra —— 它会再装一份 opencv-python, 跟
# 本项目的 opencv-python-headless 打架。
local = [
  "dxcam[winrt]>=0.3,<0.4",
]
dev = [
  "build>=1.2,<2",
  "onnx>=1.17,<2",
]

[project.urls]
Homepage = "https://github.com/JayziLi/endfield"
Documentation = "https://github.com/JayziLi/endfield#readme"
Issues = "https://github.com/JayziLi/endfield/issues"

[project.scripts]
endfield = "rhodes_fast.__main__:main"
endfield-gui = "rhodes_fast.gui_web.app:main"
endfield-gui-next = "rhodes_fast.gui_web.app:main"
endfield-gui-classic = "rhodes_fast.gui:main"

[tool.setuptools.packages.find]
include = ["rhodes_fast*"]

# WebView 界面的静态资产。packages.find 只收带 __init__.py 的包, 而 web/ 下全是
# CSS / woff2 / js —— 不点名的话它们一个都不会进 wheel, 装完 endfield-gui-next
# 打开就是个 404 窗口, 而且本地跑得好好的, 只有发版之后才暴露。
[tool.setuptools.package-data]
"rhodes_fast.gui_web" = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/design/*.css",
    "web/design/tokens/*.css",
    "web/design/components/*.css",
    "web/fonts/*.woff2",
]
