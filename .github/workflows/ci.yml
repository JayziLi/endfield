name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test environment
        run: python -m pip install -e ".[cpu,dev]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source package
        run: python -m build
